<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moderación · España, un país que puede funcionar</title>
<meta name="theme-color" content="#100a1c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="paginas.css">
<style>
:root{--w:860px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:.9rem}
.tab[aria-pressed=true]{background:#fff;color:var(--dark);border-color:transparent}
.tab b{font-variant-numeric:tabular-nums;margin-left:4px}
.tab .dot{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--pk);color:#2a0518;font-size:.78rem;margin-left:6px;text-align:center}
.item{background:rgba(16,10,28,.6);border:1px solid var(--edge);border-radius:16px;padding:16px 18px;margin-bottom:10px}
.item.new{border-color:rgba(255,79,168,.6)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted)}
.meta b{color:#fff}
.meta .tag{color:var(--pk2);font-weight:650}
.where{font-size:.84rem;color:var(--gr2);margin-top:2px}
.body{margin:8px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{border:1px dashed var(--edge);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
details{margin-top:30px}
.item details{margin-top:8px}
.vt{width:100%;border-collapse:collapse;font-size:.92rem;background:rgba(16,10,28,.6);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.vt th{text-align:left;font-size:.76rem;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--edge);white-space:nowrap}
.vt td{padding:9px 12px;border-bottom:1px solid var(--line);color:#fff;font-variant-numeric:tabular-nums}
.vt td:first-child{color:var(--text)}
.vt td.g{color:var(--gr);font-weight:700}.vt td.r{color:var(--pk2);font-weight:700}
summary{cursor:pointer;font-weight:600;color:#fff}
</style>
</head>
<body>
<div class="top"><a class="brand" href="./"><img src="favicon.svg" alt="" width="30" height="30"><span>Moderación</span></a><button class="btn alt sm" id="out" hidden>Salir</button></div>
<main class="wrap">
 <form class="panel" id="login" style="max-width:420px;margin-inline:auto">
  <h1 style="font-size:1.8rem;margin:0 0 6px">Panel de moderación</h1>
  <p class="note" style="margin-top:0">Solo para el responsable de la web.</p>
  <label class="field">Clave<input name="key" type="password" autocomplete="current-password" required></label>
  <p class="msg" id="lm" role="status" aria-live="polite"></p>
  <button class="btn" type="submit">Entrar</button>
 </form>

 <div id="app" hidden>
  <div class="head"><div><p class="kicker">Panel privado</p><h1 style="margin-bottom:0">Moderación</h1></div><button class="btn alt sm" id="reload">Actualizar</button></div>
  <div class="tabs" id="tabs" role="group" aria-label="Sección"></div>
  <p class="msg" id="am" role="status" aria-live="polite"></p>
  <div id="list"></div>
  <details><summary>Cambiar la clave</summary>
   <form class="panel" id="chg" style="max-width:420px;margin-top:12px">
    <label class="field">Clave nueva <small>(mínimo 12 caracteres)</small><input name="n1" type="password" autocomplete="new-password" minlength="12" required></label>
    <label class="field">Repítela<input name="n2" type="password" autocomplete="new-password" minlength="12" required></label>
    <p class="msg" id="cm" role="status" aria-live="polite"></p>
    <button class="btn" type="submit">Guardar clave</button>
   </form>
  </details>
 </div>
</main>
<script src="propuestas.js"></script>
<script>
const CONFIG={supabaseUrl:"https://roglrkyhkoqngqqdnefh.supabase.co",supabaseKey:"sb_publishable_GQEgyQTx05J09R0-YvcLNQ_S0b6tQQg"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BLOQUES=((window.PROGRAMA||{}).bloques||[]).map(b=>b.nombre);
const titles=Object.fromEntries(((window.PROGRAMA||{}).propuestas||[]).map(p=>[p.id,p.title]));
const fdate=s=>{try{return new Date(s).toLocaleString("es-ES",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
let KEY="",D={comments:[],messages:[],alerts:[],alerts_all:[],alerts_people:0,ideas:[],votes:[],alerts_by_email:[]},TAB="pending",ALV="p";
try{KEY=sessionStorage.getItem("epf-mod")||""}catch(e){}
const ERR={forbidden:"Clave incorrecta.",rate_limit:"Demasiados intentos fallidos. Espera 15 minutos.",invalid_input:"Datos no válidos."};
async function rpc(fn,args){
 const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:CONFIG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({p_key:KEY,...args})});
 if(!r.ok)throw new Error("No se pudo conectar con el servidor.");
 const j=await r.json();if(j&&j.error){const e=new Error(ERR[j.error]||"Error.");e.code=j.error;throw e}return j;
}
async function load(){D=await rpc("mod_list",{});(D.ideas||[]).forEach(i=>{titles["c-"+i.id]=i.title+" (propuesta ciudadana)"});render()}
function show(on){$("login").hidden=on;$("app").hidden=!on;$("out").hidden=!on}
function logout(){KEY="";try{sessionStorage.removeItem("epf-mod")}catch(e){}show(false);$("login").key.value=""}
const TABS=[["pending","Pendientes"],["published","Publicadas"],["rejected","Rechazadas"],["ideas","Propuestas"],["messages","Mensajes"],["alerts","Avisos de firmas"],["votes","Votos"]];
function render(){
 const n={pending:0,published:0,rejected:0};D.comments.forEach(c=>n[c.status]++);
 const unread=D.messages.filter(x=>!x.read).length;
 $("tabs").innerHTML=TABS.map(([k,l])=>`<button type="button" class="tab" data-tab="${k}" aria-pressed="${TAB===k}">${l}${k==="votes"?"":k==="ideas"?`<b>${(D.ideas||[]).length}</b>${(D.ideas||[]).some(i=>i.status==="pending")?`<span class="dot">${D.ideas.filter(i=>i.status==="pending").length} por revisar</span>`:""}`:k==="alerts"?`<b>${D.alerts_people||0}</b>`:k==="messages"?`<b>${D.messages.length}</b>${unread?`<span class="dot">${unread} sin leer</span>`:""}`:`<b>${n[k]}</b>`}</button>`).join("");
 if(TAB==="ideas"){
  const ST={pending:"Pendiente",published:"Publicada",rejected:"Rechazada"};
  $("list").innerHTML=(D.ideas||[]).map(i=>`<article class="item${i.status==="pending"?" new":""}"><div class="meta"><b>${esc(i.alias)}</b><span>${fdate(i.at)}</span><span class="tag">${ST[i.status]}</span></div>
<p class="body" style="font-weight:700;margin-bottom:4px">${esc(i.title)}</p><p class="body" style="margin-top:0">${esc(i.body)}</p>
<label class="field" style="margin:0 0 12px;max-width:420px">Categoría en la que aparece<select data-blk="${i.id}" style="display:block;width:100%;margin-top:5px;border:1px solid var(--edge);background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;min-height:42px;font-weight:400">${[["","Sin categoría (solo en «Propuestas ciudadanas»)"],...BLOQUES.map(b=>[b,b])].map(([v,l])=>`<option value="${esc(v)}"${(i.block||"")===v?" selected":""}>${esc(l)}</option>`).join("")}${i.block&&!BLOQUES.includes(i.block)?`<option selected>${esc(i.block)}</option>`:""}</select></label>
<div class="acts">${i.status!=="published"?`<button class="btn ok sm" data-i="published" data-id="${i.id}">Publicar</button>`:""}${i.status!=="rejected"?`<button class="btn no sm" data-i="rejected" data-id="${i.id}">Rechazar</button>`:""}${i.status!=="pending"?`<button class="btn alt sm" data-i="pending" data-id="${i.id}">Devolver a pendientes</button>`:""}</div></article>`).join("")||'<div class="empty">Nadie ha propuesto medidas todavía.</div>';
  return;
 }
 if(TAB==="votes"){
  const vt=Object.fromEntries((D.votes||[]).map(v=>[v.p,v])),al=Object.fromEntries((D.alerts||[]).map(a=>[a.p,a.n]));
  const ids=[...new Set([...Object.keys(titles),...Object.keys(vt)])];
  const rows=ids.map(id=>{const v=vt[id]||{up:0,down:0},n=v.up+v.down;return {t:titles[id]||id,up:v.up,down:v.down,pc:n?Math.round(v.up/n*100)+"%":"–",al:al[id]||0}}).sort((a,b)=>b.up-a.up||a.down-b.down||a.t.localeCompare(b.t));
  const tu=rows.reduce((s,r)=>s+r.up,0),td=rows.reduce((s,r)=>s+r.down,0);
  $("list").innerHTML=`<p class="note" style="margin:0 0 12px">${tu+td} votos en total (${tu} a favor y ${td} en contra) de ${D.voters||0} ${D.voters===1?"dispositivo":"dispositivos"}. Ordenadas por votos a favor.</p>
<div style="overflow-x:auto"><table class="vt"><thead><tr><th>Medida</th><th>A favor</th><th>En contra</th><th>Apoyo</th><th>Avisos</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.t)}</td><td class="g">${r.up}</td><td class="r">${r.down}</td><td>${r.pc}</td><td>${r.al||""}</td></tr>`).join("")}</tbody></table></div>`;
  return;
 }
 if(TAB==="alerts"&&ALV==="e"){
  const be=D.alerts_by_email||[];
  $("list").innerHTML=`<p class="acts" style="margin-bottom:12px"><button class="btn alt sm" data-alv="p">Ver por medida</button><button class="btn sm" data-alv="e">Ver por correo</button></p>`
   +(be.map(a=>`<article class="item"><div class="meta"><b>${esc(a.email)}</b><span>${a.ps.length} ${a.ps.length===1?"medida":"medidas"}</span>${a.all?'<span class="tag">Quiere aviso de cualquier recogida</span>':""}</div><ul style="margin:8px 0 0;padding-left:20px">${a.ps.map(p=>`<li>${esc(titles[p]||p)}</li>`).join("")}</ul></article>`).join("")||'<div class="empty">Nadie ha pedido aviso todavía.</div>');
  return;
 }
 if(TAB==="alerts"){
  const al=D.alerts||[],all=D.alerts_all||[];
  $("list").innerHTML=`<p class="acts" style="margin-bottom:12px"><button class="btn sm" data-alv="p">Ver por medida</button><button class="btn alt sm" data-alv="e">Ver por correo</button></p><p class="note" style="margin:0 0 12px">${D.alerts_people||0} ${D.alerts_people===1?"persona ha":"personas han"} dejado su correo. Cada lista es de quienes quieren aviso si se abre la recogida de firmas de esa medida.</p>`
   +(all.length?`<article class="item"><div class="meta"><b>Quieren aviso de cualquier recogida de firmas</b><span>${all.length} ${all.length===1?"correo":"correos"}</span></div><details><summary>Ver correos</summary><p class="body">${all.map(esc).join("\n")}</p></details><div class="acts"><button class="btn alt sm" data-copy="${esc(all.join(", "))}">Copiar correos</button></div></article>`:"")
   +(al.map(a=>`<article class="item"><div class="meta"><b>${esc(titles[a.p]||a.p)}</b><span>${a.n} ${a.n===1?"correo":"correos"}</span></div><details><summary>Ver correos</summary><p class="body">${a.emails.map(esc).join("\n")}</p></details><div class="acts"><button class="btn alt sm" data-copy="${esc(a.emails.join(", "))}">Copiar correos</button></div></article>`).join("")||'<div class="empty">Nadie ha pedido aviso todavía.</div>')
   +`<form class="panel" id="delAl" style="max-width:420px"><label class="field" style="margin-top:0">Borrar un correo de todas las listas<input name="email" type="email" required placeholder="correo@ejemplo.com"></label><button class="btn alt sm" type="submit" style="margin-top:10px">Borrar</button></form>`;
  return;
 }
 if(TAB==="messages"){
  $("list").innerHTML=D.messages.map(x=>`<article class="item${x.read?"":" new"}"><div class="meta"><b>${esc(x.name)}</b><span>${fdate(x.at)}</span>${x.read?"":'<span class="tag">Sin leer</span>'}<span>${x.emailed?"Enviado a tu correo":"No enviado por correo"}</span></div>
<div class="where">${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:""}${x.email&&x.phone?" · ":""}${x.phone?`<a href="tel:${esc(x.phone.replace(/[^0-9+]/g,""))}">${esc(x.phone)}</a>`:""}</div>
<p class="body">${esc(x.body)}</p><div class="acts"><button class="btn alt sm" data-m="${x.read?"unread":"read"}" data-id="${x.id}">${x.read?"Marcar como no leído":"Marcar como leído"}</button><button class="btn alt sm" data-m="delete" data-id="${x.id}">Borrar</button></div></article>`).join("")||'<div class="empty">No hay mensajes de contacto.</div>';
  return;
 }
 const rows=D.comments.filter(c=>c.status===TAB);
 $("list").innerHTML=rows.map(c=>`<article class="item${c.reports?" new":""}"><div class="meta"><b>${esc(c.alias)}</b><span>${fdate(c.at)}</span>${c.reports?`<span class="tag">${c.reports} ${c.reports===1?"denuncia":"denuncias"}</span>`:""}</div>
<div class="where">${titles[c.p]?`<a href="./#m=${esc(c.p)}" target="_blank" rel="noopener">${esc(titles[c.p])}</a>`:`Medida que ya no existe (${esc(c.p)})`}</div>
${c.to?`<p class="note" style="margin-top:6px">Responde a <b style="color:#fff">${esc(c.to.alias)}</b>: «${esc(c.to.body)}»</p>`:""}
<p class="body">${esc(c.body)}</p><div class="acts">${c.status!=="published"?`<button class="btn ok sm" data-c="published" data-id="${c.id}">Publicar</button>`:""}${c.status!=="rejected"?`<button class="btn no sm" data-c="rejected" data-id="${c.id}">Rechazar</button>`:""}${c.status!=="pending"?`<button class="btn alt sm" data-c="pending" data-id="${c.id}">Devolver a pendientes</button>`:""}</div></article>`).join("")
  ||`<div class="empty">${TAB==="pending"?"No hay opiniones pendientes de revisar.":TAB==="published"?"Todavía no hay opiniones publicadas.":"No hay opiniones rechazadas."}</div>`;
}
const say=(t,cls)=>{$("am").className="msg "+(cls||"");$("am").textContent=t};
$("login").addEventListener("submit",async e=>{
 e.preventDefault();const lm=$("lm"),b=e.target.querySelector("button");KEY=e.target.key.value;b.disabled=true;lm.className="msg";lm.textContent="Comprobando…";
 try{await load();try{sessionStorage.setItem("epf-mod",KEY)}catch(x){}lm.textContent="";show(true)}catch(x){KEY="";lm.className="msg err";lm.textContent=x.message}
 b.disabled=false;
});
$("out").addEventListener("click",logout);
$("reload").addEventListener("click",async()=>{say("Actualizando…");try{await load();say("")}catch(x){say(x.message,"err");if(x.code==="forbidden")logout()}});
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-tab]");if(t){TAB=t.dataset.tab;render();return}
 const cp=e.target.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);say("Correos copiados. Pégalos en el campo CCO de tu correo para que nadie vea las direcciones de los demás.","ok")}catch(x){say("No se pudo copiar. Abre «Ver correos» y cópialos a mano.","err")}return}
 const av=e.target.closest("[data-alv]");if(av){ALV=av.dataset.alv;render();return}
 const b=e.target.closest("[data-c],[data-m],[data-i]");if(!b)return;
 const id=+b.dataset.id;
 if(b.dataset.m==="delete"&&!confirm("¿Borrar este mensaje definitivamente?"))return;
 b.disabled=true;say("Guardando…");
 try{
  if(b.dataset.i)await rpc("mod_set_idea",{p_id:id,p_status:b.dataset.i});
  else if(b.dataset.c)await rpc("mod_set_comment",{p_id:id,p_status:b.dataset.c});
  else await rpc("mod_set_message",{p_id:id,p_action:b.dataset.m});
  await load();say(b.dataset.i==="published"?"Propuesta publicada.":b.dataset.i==="rejected"?"Propuesta rechazada.":b.dataset.c==="published"?"Opinión publicada.":b.dataset.c==="rejected"?"Opinión rechazada.":"Hecho.","ok");
 }catch(x){say(x.message,"err");b.disabled=false;if(x.code==="forbidden")logout()}
});
document.addEventListener("submit",async e=>{
 if(e.target.id!=="delAl")return;e.preventDefault();const em=e.target.email.value.trim();if(!em||!confirm("¿Borrar "+em+" de todas las listas de avisos?"))return;
 try{const r=await rpc("mod_delete_alert",{p_email:em});await load();say(r.deleted?"Correo borrado de "+r.deleted+" "+(r.deleted===1?"lista.":"listas."):"Ese correo no estaba en ninguna lista.","ok")}catch(x){say(x.message,"err")}
});
document.addEventListener("change",async e=>{
 const s=e.target.closest("[data-blk]");if(!s)return;say("Guardando…");
 try{await rpc("mod_set_idea_block",{p_id:+s.dataset.blk,p_block:s.value});await load();say("Categoría cambiada.","ok")}catch(x){say(x.message,"err")}
});
$("chg").addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,cm=$("cm");
 if(f.n1.value.length<12){cm.className="msg err";cm.textContent="La clave debe tener al menos 12 caracteres.";return}
 if(f.n1.value!==f.n2.value){cm.className="msg err";cm.textContent="Las dos claves no coinciden.";return}
 try{await rpc("mod_change_key",{p_new:f.n1.value});KEY=f.n1.value;try{sessionStorage.setItem("epf-mod",KEY)}catch(x){}f.reset();cm.className="msg ok";cm.textContent="Clave cambiada."}
 catch(x){cm.className="msg err";cm.textContent=x.message}
});
if(KEY)load().then(()=>show(true)).catch(()=>logout());
</script>
</body>
</html>
